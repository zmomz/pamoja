# Local development: a stock WordPress with the Pamoja theme and plugin mounted in.
#   docker compose up -d   →  http://localhost:8080
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp:/var/www/html
      - ./wp-content/themes/pamoja:/var/www/html/wp-content/themes/pamoja
      - ./wp-content/plugins/pamoja-content:/var/www/html/wp-content/plugins/pamoja-content

volumes:
  db:
  wp:
